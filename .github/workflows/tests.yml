name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pilomar_platesolve simulate m31 --time 2026-11-25T04:00:00Z
      - run: python -m pilomar_platesolve simulate-align --time 2026-11-27T04:00:00Z
